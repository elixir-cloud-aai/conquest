name: ghcr

# Builds every Conquest image and publishes it to the GitHub Container
# Registry of the repository's owner (ghcr.io/<owner>/<image>), with the
# workflow's GITHUB_TOKEN: no secret needed. Separate from images.yaml (Docker
# Hub), which runs only in anuragxxd/conquest.
#
#   pull request    -> build and scan each image, publish nothing
#   push to master  -> push by digest, scan, attest, sign, tag sha-<short>
#
# Job graph (push)
# ----------------
#   push ──> scan ──> publish
#
# `push` builds each image once and pushes it by digest only (untagged, with
# SBOM and provenance attestations). `scan` scans exactly those digests with
# Trivy in a job that can't write packages. `publish` attests the build
# provenance of each scanned digest, signs it (cosign keyless, with the
# workflow's OIDC identity) and only then tags it, so a tag always points to
# a scanned, signed digest. `publish` runs only when every image was pushed
# and scanned, so either all images get the tag or none does.
#
# The nf-*-runner images layer the conquest binary onto a Nextflow runtime
# base (docker/nf-runtime). Each runner job builds its base in the same job
# into a local OCI layout and builds the runner on top of it by digest, so a
# runner never uses a stale or foreign base and the base is never published
# on its own.
#
# Verify a published image (example):
#
#   cosign verify ghcr.io/<owner>/conquest@sha256:<digest> \
#     --certificate-identity-regexp '^https://github.com/<owner>/conquest/\.github/workflows/ghcr\.yaml@refs/heads/master$' \
#     --certificate-oidc-issuer https://token.actions.githubusercontent.com
#   gh attestation verify oci://ghcr.io/<owner>/conquest@sha256:<digest> --repo <owner>/conquest

on:
  push:
    branches: ["master"]
  pull_request:
    branches: ["master"]
  workflow_dispatch:

permissions:
  contents: read

# A new commit on a pull request cancels the pull request's runs in progress;
# pushes to master each get their own group, so none is dropped
concurrency:
  group: ${{ github.workflow }}-${{ github.event_name == 'push' && github.sha || github.ref }}
  cancel-in-progress: ${{ github.event_name == 'pull_request' }}

env:
  REGISTRY: ghcr.io/${{ github.repository_owner }}
  # amd64 only: the deployments of these images run on amd64. Add linux/arm64
  # here when needed (the Nextflow bases then build under QEMU, much slower).
  PLATFORMS: linux/amd64
  NXF_PLUGINS_ALLOWED: nf-ga4gh,nf-amazon,nf-schema,nf-core-utils,nf-fgbio,nf-prov
  # Trivy fails the scan on fixable critical and high findings only when this
  # is "true". The images inherit fixable findings from their bases and Go
  # dependencies; until those are fixed, the findings go to code scanning (and
  # a full report to each scan job's artifacts) without blocking publication.
  SCAN_FAIL: "false"

jobs:
  # ---------------------------------------------------------------------------
  # Pull requests: build and scan each image locally, publish nothing.
  # ---------------------------------------------------------------------------
  build:
    name: Build image (${{ matrix.name }})
    if: github.event_name == 'pull_request'
    runs-on: ubuntu-latest
    timeout-minutes: 60
    permissions:
      contents: read
    strategy:
      fail-fast: false
      matrix: &images
        include:
          - name: conquest
            file: docker/server/Dockerfile
          - name: conquest-wdl-runner
            file: docker/wdl-runner/Dockerfile
          - name: conquest-smk-9.17.3-runner
            file: docker/smk-runner/Dockerfile
            target: runner
            build_args: SNAKEMAKE_VERSION=9.17.3
          # The same Dockerfile's last stage: the runner as root, for tasks
          # on remote TES servers (see docker/smk-runner/Dockerfile)
          - name: conquest-smk-9.17.3-task
            file: docker/smk-runner/Dockerfile
            target: task
            cache_scope: conquest-smk-9.17.3-runner
            build_args: SNAKEMAKE_VERSION=9.17.3
          - name: conquest-smk-7.32.4-runner
            file: docker/smk-runner/v7.Dockerfile
            build_args: SNAKEMAKE_VERSION=7.32.4
          # Plugin pins per Nextflow version as in images.yaml (nf-runtime)
          - name: conquest-nf-24.10.4-runner
            file: docker/nf-runner/Dockerfile
            nxf_version: "24.10.4"
            nxf_plugins: "nf-ga4gh@1.3.0 nf-amazon@2.9.0"
          - name: conquest-nf-25.04.3-runner
            file: docker/nf-runner/Dockerfile
            nxf_version: "25.04.3"
            nxf_plugins: "nf-ga4gh@1.3.0 nf-amazon@2.9.0"
          - name: conquest-nf-25.10.2-runner
            file: docker/nf-runner/Dockerfile
            nxf_version: "25.10.2"
            nxf_plugins: "nf-ga4gh@1.4.0 nf-amazon@2.9.0"
          - name: conquest-nf-25.10.4-runner
            file: docker/nf-runner/Dockerfile
            nxf_version: "25.10.4"
            nxf_plugins: "nf-ga4gh@1.4.0 nf-amazon@2.9.0"
    steps:
      - &checkout
        name: Check out repository
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false

      - &setup-buildx
        name: Set up Docker Buildx
        uses: docker/setup-buildx-action@f87e5991a6d7451dcb8d9637bfbc97413f497069 # v4.4.1

      # Nextflow runners only: the runtime base, into a local OCI layout
      - &nf-runtime
        name: Build Nextflow runtime base
        id: nf-runtime
        if: matrix.nxf_version != ''
        uses: docker/build-push-action@c3c9e263c25d99ce0380d002d59b67737d91b0dc # v7.4.0
        with:
          context: .
          file: docker/nf-runtime/Dockerfile
          platforms: ${{ env.PLATFORMS }}
          build-args: |
            NXF_VER=${{ matrix.nxf_version }}
            NXF_PREINSTALL_PLUGINS=${{ matrix.nxf_plugins }}
          outputs: type=oci,dest=${{ runner.temp }}/nf-runtime,tar=false
          cache-from: type=gha,scope=ghcr-nf-runtime-${{ matrix.nxf_version }}
          cache-to: type=gha,mode=max,scope=ghcr-nf-runtime-${{ matrix.nxf_version }}
          provenance: false
          sbom: false

      # Pull requests load the image into the local Docker engine; pushes
      # push it by digest only (untagged), with SBOM and provenance
      - &build-image
        name: Build image
        id: build
        uses: docker/build-push-action@c3c9e263c25d99ce0380d002d59b67737d91b0dc # v7.4.0
        with:
          context: .
          file: ${{ matrix.file }}
          target: ${{ matrix.target }}
          platforms: ${{ env.PLATFORMS }}
          build-args: |
            ${{ matrix.build_args }}
            ${{ matrix.nxf_version && 'NXF_BASE_IMAGE=nf-runtime' || '' }}
            ${{ matrix.nxf_version && format('NXF_PLUGINS_ALLOWED={0}', env.NXF_PLUGINS_ALLOWED) || '' }}
          build-contexts: ${{ matrix.nxf_version && format('nf-runtime=oci-layout://{0}/nf-runtime@{1}', runner.temp, steps.nf-runtime.outputs.digest) || '' }}
          labels: |
            org.opencontainers.image.source=${{ github.server_url }}/${{ github.repository }}
            org.opencontainers.image.revision=${{ github.sha }}
          annotations: ${{ github.event_name != 'pull_request' && format('index:org.opencontainers.image.source={0}/{1}', github.server_url, github.repository) || '' }}
          outputs: ${{ github.event_name == 'pull_request' && format('type=docker,name=ci/{0}:pr', matrix.name) || format('type=image,name={0}/{1},push-by-digest=true,name-canonical=true,push=true', env.REGISTRY, matrix.name) }}
          sbom: ${{ github.event_name != 'pull_request' }}
          provenance: ${{ github.event_name != 'pull_request' && 'mode=max' || 'false' }}
          # The task image reads the runner's cache (its layers are the
          # runner's) and writes none, so the two jobs don't race on a scope
          cache-from: type=gha,scope=ghcr-${{ matrix.cache_scope || matrix.name }}
          cache-to: ${{ !matrix.cache_scope && format('type=gha,mode=max,scope=ghcr-{0}', matrix.name) || '' }}

      - name: Scan image
        uses: elixir-cloud-aai/.github/actions/scan-image@bf3840c9c072aaf37d6cafe199aaa1994087d1ef # v1.2.0
        with:
          image: ci/${{ matrix.name }}:pr
          category: ghcr-${{ matrix.name }}
          upload: "false"
          fail: ${{ env.SCAN_FAIL }}

  # ---------------------------------------------------------------------------
  # Pushes: push each image by digest, untagged.
  # ---------------------------------------------------------------------------
  push:
    name: Push image (${{ matrix.name }})
    # Only master publishes (also when run by hand)
    if: github.event_name != 'pull_request' && github.ref == 'refs/heads/master'
    runs-on: ubuntu-latest
    timeout-minutes: 60
    permissions:
      contents: read
      packages: write
    strategy:
      fail-fast: false
      matrix: *images
    steps:
      - *checkout
      - &login
        name: Log in to GHCR
        uses: docker/login-action@81c6f93d4bc991e510b342a00b419b3bb4efc5c6 # v4.7.0
        with:
          registry: ghcr.io
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}
      - *setup-buildx
      - *nf-runtime
      - *build-image
      # All jobs of a matrix share one set of outputs, so the digest goes on
      # as an artifact
      - name: Save image digest
        env:
          DIGEST: ${{ steps.build.outputs.digest }}
        run: echo "${DIGEST}" > "${RUNNER_TEMP}/digest.txt"
      - name: Upload image digest
        uses: actions/upload-artifact@cf430e030ddbb5b0abf93d22962f4752f3646cd9 # v7.0.2
        with:
          name: digest-${{ matrix.name }}
          path: ${{ runner.temp }}/digest.txt
          if-no-files-found: error
          # A re-run pushes a new digest, which replaces the earlier one
          overwrite: true

  # ---------------------------------------------------------------------------
  # Scan exactly the pushed digests, in a job that can read but not write
  # packages (the packages may be private until made public).
  # ---------------------------------------------------------------------------
  scan:
    name: Scan image (${{ matrix.name }})
    needs: push
    runs-on: ubuntu-latest
    timeout-minutes: 30
    permissions:
      contents: read
      packages: read
      security-events: write
    strategy:
      fail-fast: false
      matrix: *images
    steps:
      - *checkout
      - &download-digest
        name: Download image digest
        uses: actions/download-artifact@9000827ccba6bdab643e8b6fd33ac0654aef8333 # v8.0.2
        with:
          name: digest-${{ matrix.name }}
          path: ${{ runner.temp }}
      - &read-digest
        name: Read image digest
        id: digest
        run: |
          digest="$(cat "${RUNNER_TEMP}/digest.txt")"
          if [[ ! "${digest}" =~ ^sha256:[0-9a-f]{64}$ ]]; then
              echo "::error::Invalid image digest '${digest}'"
              exit 1
          fi
          echo "digest=${digest}" >> "${GITHUB_OUTPUT}"
      - *login
      - name: Scan image
        uses: elixir-cloud-aai/.github/actions/scan-image@bf3840c9c072aaf37d6cafe199aaa1994087d1ef # v1.2.0
        with:
          image: ${{ env.REGISTRY }}/${{ matrix.name }}@${{ steps.digest.outputs.digest }}
          category: ghcr-${{ matrix.name }}
          report: "true"
          fail: ${{ env.SCAN_FAIL }}

  # ---------------------------------------------------------------------------
  # Attest, sign, then tag each scanned digest.
  # ---------------------------------------------------------------------------
  publish:
    name: Publish image (${{ matrix.name }})
    needs: scan
    runs-on: ubuntu-latest
    timeout-minutes: 20
    permissions:
      contents: read
      packages: write
      id-token: write # Sigstore signing certificates
      attestations: write # GitHub artifact attestations
    strategy:
      fail-fast: false
      matrix: *images
    steps:
      - *download-digest
      - *read-digest
      - *login
      - *setup-buildx
      - name: Attest build provenance
        uses: actions/attest-build-provenance@4d101475d8b20a2381f78447822ac1eab6504dd8 # v4.2.2
        with:
          subject-name: ${{ env.REGISTRY }}/${{ matrix.name }}
          subject-digest: ${{ steps.digest.outputs.digest }}
          push-to-registry: true
          # No artifact metadata storage record (needs another permission)
          create-storage-record: false
      - name: Install cosign
        uses: sigstore/cosign-installer@6f9f17788090df1f26f669e9d70d6ae9567deba6 # v4.1.2
      # The signature covers the digest, and so every tag of it
      - name: Sign image
        env:
          IMAGE: ${{ env.REGISTRY }}/${{ matrix.name }}@${{ steps.digest.outputs.digest }}
        run: cosign sign --yes "${IMAGE}"
      # sha-<short commit> points to the scanned and signed digest, the same
      # scheme as images.yaml's Docker Hub tags
      - name: Tag image
        env:
          IMAGE: ${{ env.REGISTRY }}/${{ matrix.name }}
          DIGEST: ${{ steps.digest.outputs.digest }}
        run: |
          tag="${IMAGE}:sha-${GITHUB_SHA::7}"
          docker buildx imagetools create --tag "${tag}" "${IMAGE}@${DIGEST}"
          actual="$(docker buildx imagetools inspect "${tag}" \
              --format '{{ json .Manifest }}' | jq -r .digest)"
          if [[ "${actual}" != "${DIGEST}" ]]; then
              echo "::error::${tag} points to ${actual}, expected ${DIGEST}"
              exit 1
          fi
          echo "| \`${tag}\` | \`${DIGEST}\` |" >> "${GITHUB_STEP_SUMMARY}"
