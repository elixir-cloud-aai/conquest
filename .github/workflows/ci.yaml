name: ci

on:
  push:
    branches: ["master"]
  pull_request:
    branches: ["master"]

permissions:
  contents: read

# A new commit on a pull request cancels the pull request's runs in progress;
# pushes to master each get their own group, so none is dropped
concurrency:
  group: ${{ github.workflow }}-${{ github.event_name == 'push' && github.sha || github.ref }}
  cancel-in-progress: ${{ github.event_name == 'pull_request' }}

jobs:
  build-test:
    runs-on: ubuntu-latest
    steps:
      - name: Check out repository
        uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4.4.0

      - name: Set up Go
        uses: actions/setup-go@40f1582b2485089dde7abd97c1529aa768e1baff # v5.6.0
        with:
          go-version: stable
          cache: true

      - name: gofmt
        run: |
          unformatted="$(gofmt -s -l . | grep -v '^$' || true)"
          if [ -n "$unformatted" ]; then
            echo "these files need gofmt -s -w:"
            echo "$unformatted"
            exit 1
          fi

      - name: go vet
        run: go vet ./...

      - name: go build
        run: go build ./...

      - name: go test
        run: go test -race -count=1 ./...

  # Storage isolation against a real S3 server that checks signatures
  # (SeaweedFS: MinIO publishes no images any more)
  storage-integration:
    runs-on: ubuntu-latest
    timeout-minutes: 15
    steps:
      - name: Check out repository
        uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4.4.0

      - name: Set up Go
        uses: actions/setup-go@40f1582b2485089dde7abd97c1529aa768e1baff # v5.6.0
        with:
          go-version: stable
          cache: true

      - name: Start S3 server
        run: |
          docker run -d --name s3 -p 127.0.0.1:8333:8333 \
            -v "$PWD/internal/isolation/testdata/s3.json:/etc/seaweedfs/s3.json:ro" \
            chrislusf/seaweedfs:4.52@sha256:57877e32bb90073b37dc109b438ba66e84fd5ed9ced5f5c04f56444ef243ce59 \
            server -dir=/data -s3 -s3.port=8333 -s3.config=/etc/seaweedfs/s3.json \
            -master.volumeSizeLimitMB=64 -volume.max=20
          # ready once S3 refuses an unsigned request
          for i in $(seq 1 60); do
            code="$(curl -s -o /dev/null -w '%{http_code}' http://127.0.0.1:8333/ || true)"
            [ "$code" = 403 ] && exit 0
            sleep 1
          done
          docker logs s3
          exit 1

      - name: go test -tags integration
        env:
          CONQUEST_TEST_S3_ENDPOINT: http://127.0.0.1:8333
          CONQUEST_TEST_S3_ACCESS_KEY: conquest-test
          CONQUEST_TEST_S3_SECRET_KEY: conquest-test-secret
        run: go test -tags integration -race -count=1 -v ./internal/isolation/

  python-plugin:
    runs-on: ubuntu-latest
    steps:
      - name: Check out repository
        uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4.4.0

      # Same Python as the Snakemake runner image (docker/smk-runner).
      - name: Set up Python
        uses: actions/setup-python@a26af69be951a213d495a4c3e4e4022e16d87065 # v5.6.0
        with:
          python-version: "3.12"

      - name: Install the Snakemake executor and miniwdl plugins
        run: pip install ./python ./python/miniwdl_conquest_tes pytest

      - name: pytest
        run: pytest -q python/tests python/miniwdl_conquest_tes/tests

  # The one check to require in branch protection: it fails if any job above
  # failed or was cancelled, so adding a job needs no change to the protection
  # rules, only to `needs`
  ci-passed:
    name: CI passed
    if: always()
    needs: [build-test, storage-integration, python-plugin]
    runs-on: ubuntu-latest
    permissions: {}
    steps:
      - name: Check results of all jobs
        env:
          RESULTS: ${{ join(needs.*.result, ' ') }}
        run: |
          echo "results: $RESULTS"
          for r in $RESULTS; do
            if [ "$r" != "success" ] && [ "$r" != "skipped" ]; then
              exit 1
            fi
          done
