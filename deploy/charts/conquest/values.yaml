conquest:
  appname: conquest

  # Every Conquest image below is pinned to the same commit. CI publishes
  # sha-<commit> for all of them on each push to master; bump them together.
  image:
    repository: docker.io/anurag1201/conquest
    tag: sha-d618619
    pullPolicy: Always

  runnerImage:
    repository: docker.io/anurag1201/conquest-nf-24.10.4-runner
    tag: sha-d618619

  wdlRunnerImage:
    repository: docker.io/anurag1201/conquest-wdl-runner
    tag: sha-d618619

  snakemakeRunnerImage:
    repository: docker.io/anurag1201/conquest-smk-9.17.3-runner
    tag: sha-d618619

  snakemakeTaskImage:
    repository: docker.io/anurag1201/conquest-smk-9.17.3-runner
    tag: sha-d618619

  snakemakeDefaultJobs: 32
  snakemakeDefaultDiskMB: 8192
  runnerEphemeralStorageRequest: 20Gi
  runnerEphemeralStorageLimit: 40Gi

  # Workspace configuration — controls how runner and task pods share a
  # filesystem. Set mode to "pvc" for per-run PVCs, or "objectfs" for
  # S3-mounted per-run volumes via the Yandex S3 CSI driver + GeeseFS.
  workspace:
    mode: "emptydir"      # "emptydir", "pvc", or "objectfs"
    accessMode: "RWX"     # "RWX" or "RWO" (only used when mode is "pvc")
    storageClass: ""      # optional; empty uses cluster default (pvc only)
    size: "10Gi"          # volume size (used for pvc and objectfs)

  # Pod security for the runner and task pods Conquest creates. "restricted"
  # satisfies the restricted Pod Security Standard: every container runs as
  # runAsUser/runAsGroup with seccomp RuntimeDefault, no privilege escalation
  # and all capabilities dropped. Executor images run as that UID rather than
  # their own USER. "baseline" lets executor images run as the user they
  # declare, which is often root.
  podSecurity:
    profile: "restricted"  # "restricted" or "baseline"
    runAsUser: 1000
    runAsGroup: 1000       # also used as the pod fsGroup

  # Resources of the helper init containers of task pods (copy-tools,
  # stage-in), as for any container (requests, limits). Empty: none, so the
  # namespace's LimitRange applies, if any. Set them where a ResourceQuota
  # requires requests or limits on every container, e.g.
  #   taskHelperResources:
  #     requests: {cpu: 100m, memory: 128Mi}
  #     limits: {cpu: 500m, memory: 256Mi}
  # Executors get theirs from the TES request (CONQUEST_TASK_DEFAULT_* fill
  # in what it leaves out).
  taskHelperResources: {}

  # Optional per-version runner image overrides keyed by resolved Nextflow
  # version, e.g. {"25.04.3": "docker.io/anurag1201/conquest-nf-25.04.3-runner:v1.0.0"}.
  nextflowRunnerImages:
    "25.04.3": docker.io/anurag1201/conquest-nf-25.04.3-runner:sha-d618619
    "25.10.2": docker.io/anurag1201/conquest-nf-25.10.2-runner:sha-d618619
    "25.10.4": docker.io/anurag1201/conquest-nf-25.10.4-runner:sha-d618619

  # Optional per-version WDL runner image overrides keyed by resolved
  # miniwdl version, e.g. {"1.12.1": "docker.io/anurag1201/conquest-wdl-runner:v1.0.0"}.
  wdlRunnerImages: {}

  # External WDL imports are disabled in v1 by default. Set to true only if
  # the deployment is prepared to rely on network-resolved imports.
  wdlAllowExternalImports: false

  # Optional per-version Snakemake runner/task image overrides keyed by resolved
  # Snakemake version, e.g. {"7.32.4": "docker.io/anurag1201/conquest-smk-7.32.4-runner:v1.0.0"}.
  # The default snakemakeRunnerImage/snakemakeTaskImage above is used for the
  # platform default version (9.17.3). Non-default versions must have an entry here.
  snakemakeRunnerImages:
    "7.32.4": docker.io/anurag1201/conquest-smk-7.32.4-runner:sha-d618619
  snakemakeTaskImages:
    "7.32.4": docker.io/anurag1201/conquest-smk-7.32.4-runner:sha-d618619

  service:
    type: ClusterIP
    port: 80
    targetPort: 8080

  # Override only if runner Jobs must call the API through a non-standard
  # in-cluster address. The chart otherwise derives the service DNS name.
  internalBaseURLOverride: ""

  resources:
    limits:
      cpu: 500m
      memory: 512Mi
    requests:
      cpu: 100m
      memory: 128Mi

  podSecurityContext:
    fsGroup: 1000
    runAsNonRoot: true
    runAsUser: 1000
    seccompProfile:
      type: RuntimeDefault

  containerSecurityContext:
    allowPrivilegeEscalation: false
    capabilities:
      drop: ["ALL"]
    readOnlyRootFilesystem: true
    runAsNonRoot: true
    runAsUser: 1000
    seccompProfile:
      type: RuntimeDefault

  replicaCount: 1
  # Deployment strategy; empty: Kubernetes' default (RollingUpdate). Use
  # {type: Recreate} for an upgrade that switches authentication on or
  # changes its rules, so that no old pod serves meanwhile.
  strategy: {}

  env:
    CONQUEST_HTTP_ADDR: ":8080"
    CONQUEST_S3_BUCKET: "conquest"
    CONQUEST_S3_ENDPOINT: "http://minio.platform.svc.cluster.local:9000"
    CONQUEST_S3_REGION: "us-east-1"
    CONQUEST_LAYOUT_VERSION: "v1"
    # CONQUEST_SERVICE_ACCOUNT (ServiceAccount of runner and task pods)
    # defaults to podServiceAccount below; never set it to the server's own.
    # CONQUEST_K8S_NAMESPACE defaults to the release namespace, where the chart's
    # Role is bound. Set it here only to create Jobs somewhere else.
    # CONQUEST_IMAGE is set automatically from the deployment image in the template.
    # Runner image for Nextflow execution Jobs.
    # CONQUEST_RUNNER_IMAGE is set automatically in the template.
    # Optional version-specific Nextflow runner image overrides are injected via
    # CONQUEST_NEXTFLOW_RUNNER_IMAGES when conquest.nextflowRunnerImages is non-empty.
    # CONQUEST_WDL_RUNNER_IMAGE is set automatically in the template.
    # CONQUEST_SNAKEMAKE_RUNNER_IMAGE and CONQUEST_SNAKEMAKE_TASK_IMAGE are set
    # automatically in the template when configured.

  # ServiceAccount of the server, bound to the chart's Role.
  serviceAccount:
    create: true
    name: conquest

  # ServiceAccount of the runner and task pods (CONQUEST_SERVICE_ACCOUNT):
  # no Role bound and automountServiceAccountToken: false, so workflow code
  # gets no Kubernetes API access even if a webhook keyed on the account
  # would inject a token. Default name: <conquest.appname>-pods. With
  # create: false, name an existing account without rights (empty: the
  # namespace's default account).
  podServiceAccount:
    create: true
    name: ""

  migration:
    image:
      repository: migrate/migrate
      tag: v4.20.1
    command:
      - "-path"
      - "/migrations"
      - "-database"
      - "$(DATABASE_URL)"
      - "up"
    # Resources of the migrate init container (requests, limits). Empty: none,
    # as for taskHelperResources above.
    resources: {}

# Secrets references — matches manually created resources in the cluster.
secrets:
  postgres:
    name: conquest-db-secret
  storage:
    name: storage-secrets

# ObjectFS workspace — S3-mounted volumes via Yandex S3 CSI driver + GeeseFS.
# When enabled, installs the CSI driver components and grants Conquest
# cluster-scoped permissions for static PV management.
objectfs:
  enabled: false
  # Install CSI driver components (namespace, DaemonSet, provisioner).
  # Set to false if the CSI driver is already installed externally.
  installCSI: true
  namespace: conquest-objectfs
  # CSI driver images.
  csiS3Image: cr.yandex/crp9ftr22d26age3hulg/csi-s3:0.43.6
  csiProvisionerImage: cr.yandex/crp9ftr22d26age3hulg/yandex-cloud/csi-s3/csi-provisioner:v6.2.0
  csiRegistrarImage: cr.yandex/crp9ftr22d26age3hulg/yandex-cloud/csi-s3/csi-node-driver-registrar:v2.16.0
  # Resources of each CSI driver container (requests, limits). Empty: none.
  resources: {}
  # GeeseFS mount options (Talos-safe defaults).
  geesefs:
    memoryLimitMb: 1000
    options: "--no-systemd --dir-mode 0777 --file-mode 0666"

global:
  # All published images are public on Docker Hub, so no pull secret is needed.
  # Add entries here only when mirroring into a private registry.
  imagePullSecrets: []

# Storage gateway: remote TES endpoints read inputs and write outputs through
# capability URLs on this server (307 redirects to presigned S3 URLs), so they
# need no S3 credentials. Used by endpoints with s3_url_style: gateway.
storageGateway:
  enabled: false
  # Base URL of this server as remote endpoints reach it. Use https outside
  # trusted networks: the URLs are bearer capabilities.
  publicURL: ""
  # S3 endpoint as remote endpoints reach it, for the presigned URLs.
  # Default: conquest.env.CONQUEST_S3_ENDPOINT.
  s3PublicEndpoint: ""
  # Existing Secret with key "secret" (>= 32 bytes); generated if empty.
  existingSecret: ""

# Storage isolation: task pods get no S3 credentials. Their stage-in and
# stage-out go through the storage gateway on Conquest's in-cluster address
# (CONQUEST_INTERNAL_BASE_URL), with one capability URL per task, and every
# task, local or remote, may reach only objects below its run's root. Task
# pods must reach Conquest's Service and the presign endpoint
# (storageGateway.s3PublicEndpoint if set, else CONQUEST_S3_ENDPOINT).
# Uses the storage gateway's secret (storageGateway.existingSecret, or one
# generated); storageGateway.enabled is needed only for remote endpoints.
# Runner pods still get S3 credentials: those of their run's bucket
# (runBuckets; with "obc", they reach only that run's bucket).
storageIsolation:
  enabled: false
  # Where each run's objects live and which S3 credentials its runner pod
  # gets (CONQUEST_RUN_BUCKETS, README: Run buckets).
  # - "shared": every run in CONQUEST_S3_BUCKET, every runner with the
  #   bucket-wide credentials (CONQUEST_STORAGE_SECRET_NAME). Applies
  #   whether or not storage isolation is enabled.
  # - "obc": each run gets its own bucket through an ObjectBucketClaim
  #   (objectbucket.io, e.g. Rook/Ceph), and its runner only that bucket's
  #   credentials. Needs storageIsolation.enabled, a workspace mode other
  #   than objectfs, remote endpoints with s3_url_style: gateway, and
  #   obc.storageClassName; adds the Role rules for claims, Secrets and
  #   ConfigMaps.
  runBuckets: shared
  # Settings of runBuckets "obc" (CONQUEST_RUN_BUCKETS_OBC_*).
  obc:
    # StorageClass of the bucket provisioner (required with obc). Its
    # buckets must be in the object store at CONQUEST_S3_ENDPOINT. With
    # reclaimPolicy Delete, deleting a run's claim deletes its bucket.
    storageClassName: ""
    # Quotas of each run's bucket (additionalConfig maxSize, maxObjects),
    # where the provisioner supports them. Empty: none.
    maxSize: ""        # a quantity, e.g. 10Gi
    maxObjects: ""     # e.g. 100000
    # How long a run submission waits for its claim to be Bound, at most
    # 20s (the WES request waits for it). Empty: 20s.
    bindTimeout: ""

# Run retention (CONQUEST_RUN_RETENTION, README: Run retention): a run's data
# (its objects, or with runBuckets obc its own bucket, non-empty included) is
# deleted automatically once the run has ended longer ago than this Go
# duration; the run itself still lists. Needs CONQUEST_S3_ENDPOINT. Empty:
# off, nothing is deleted. Turning it on deletes the data of every run that
# ended longer ago at the first sweep.
runRetention: ""   # e.g. 720h (30 days)

# Runner callback authentication: each runner pod gets its run's runner
# token (env CONQUEST_RUNNER_TOKEN, derived from this secret and the run ID),
# and the runner callback API (/internal/runs/<run ID>/...) accepts only that
# token for that run, while the run is active (README: Runner callbacks).
# Always on with the chart. Rotating the secret fails active runs: drain
# them first, roll out with conquest.strategy Recreate and restart the
# Deployment (README: Runner callbacks). All runner images (including the *RunnerImages overrides)
# must be builds that send the token.
runner:
  # Existing Secret with key "runner-secret" (>= 32 bytes); generated if empty.
  # Set it when rendering without cluster access (helm template, Argo CD):
  # there every render generates a new secret.
  existingSecret: ""

# CORS: exact origins of browser front ends (e.g. a portal) that may call
# the public WES and TES APIs with a bearer token; preflight requests are
# answered without a token. Never "*". Empty (default): no CORS headers.
cors:
  allowedOrigins: []
  # - https://portal.example.org

# GA4GH service-info base fields of WES service-info (registries list the
# service by them). All empty (default): left out. If any is set, id, name,
# organization.name, organization.url and version are required (rendering
# fails otherwise).
serviceInfo:
  id: ""                # reverse domain name, e.g. org.example.conquest
  name: ""              # e.g. Conquest (no host or environment in it)
  description: ""
  organization:         # the organization that hosts this instance
    name: ""
    url: ""
  contactUrl: ""        # e.g. mailto:ops@example.org
  documentationUrl: ""
  environment: ""       # e.g. prod, test
  version: ""           # version of this deployment

# Token authentication on the public WES and TES APIs (README:
# Authentication). Off by default: the APIs are open. When on, every request
# needs an OAuth 2.0 access token of a configured issuer, callers see only
# their own runs, and creating runs or tasks needs a listed service client
# or a user holding one of create.entitlements (asked at the issuer's
# userinfo endpoint). Probes, the runner callback API (runner tokens, see
# runner above) and the storage gateway are not affected.
auth:
  enabled: false
  # Leave service-info open (a token sent there is ignored).
  serviceInfoPublic: true
  # Rendered verbatim to a ConfigMap mounted at /etc/conquest/auth/config.yaml
  # (CONQUEST_AUTH_CONFIG); snake_case keys, schema in internal/auth. Holds
  # identifiers only, never secrets. Required when enabled: issuers.
  config:
    issuers: []
    # - url: https://login.example.org/oidc/   # exactly as in the tokens' iss
    #   # jwks_uri: https://...                # default: discovery
    #   # userinfo_uri: https://...            # default: discovery
    #   audiences: [<front-end client ID>]     # whose user tokens are accepted
    #   service_clients:                       # create without entitlement
    #     - client_id: <client ID>
    # create:
    #   entitlements: [<exact entitlement>]    # never a prefix
    #   entitlement_claim: eduperson_entitlement  # default
    # algorithms: [RS256, ES256]
    # clock_skew_seconds: 60
    # timeout_seconds: 10

# Federation: route tasks to remote GA4GH TES endpoints (Funnel, TESK,
# Poiesis, proTES, another Conquest). Off by default: every task runs on
# this cluster. See internal/backend/routing for the schema.
federation:
  enabled: false
  # Name of an existing Secret whose keys become environment variables of
  # the server; endpoint auth refers to them (password_env, token_env,
  # client_secret_env).
  credentialsSecret: ""
  config:
    gateway_id: conquest
    endpoints: []
    # - name: funnel-a
    #   url: https://funnel.example.org/v1
    #   auth: {type: none}
    #   s3_url_style: endpoint       # Funnel: s3://<s3_host>/<bucket>/<key>
    #   s3_host: s3.example.org:443  # S3 as the endpoint reaches it
    #   data_classes: [public]       # run tag conquest.data_class
    #   client_selectable: true
    routing:
      client_hints: false
      rules: []
      # - name: qc-remote
      #   match: {engines: [nextflow], task_names: ["*:FASTQC*"]}
      #   backends: [funnel-a, local]
