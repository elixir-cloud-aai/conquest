---
apiVersion: rbac.authorization.k8s.io/v1
kind: Role
metadata:
  name: {{ include "conquest.fullname" . }}
  labels:
    {{- include "conquest.labels" . | nindent 4 }}
rules:
  # Job management — create, monitor, and delete task Jobs.
  - apiGroups: ["batch"]
    resources: ["jobs"]
    verbs: ["create", "get", "list", "watch", "delete"]
  # Pod monitoring — watch pod status for state mapping, read logs.
  - apiGroups: [""]
    resources: ["pods"]
    verbs: ["get", "list", "watch"]
  # Pod logs — read executor container logs for TES FULL view.
  - apiGroups: [""]
    resources: ["pods/log"]
    verbs: ["get"]
  # PVC management — create, monitor, and delete workspace PVCs.
  - apiGroups: [""]
    resources: ["persistentvolumeclaims"]
    verbs: ["create", "get", "list", "watch", "delete"]
  {{- if eq (.Values.storageIsolation.runBuckets | default "shared") "obc" }}
  # Run buckets (obc): one ObjectBucketClaim per run, and the Secret and
  # ConfigMap the bucket provisioner creates for it (bucket name and keys).
  # RBAC can't limit get by a name prefix, so the server may read every
  # Secret in the namespace; runner and task pods have no token.
  - apiGroups: ["objectbucket.io"]
    resources: ["objectbucketclaims"]
    verbs: ["create", "get", "delete"]
  - apiGroups: [""]
    resources: ["secrets", "configmaps"]
    verbs: ["get"]
  {{- end }}
---
apiVersion: rbac.authorization.k8s.io/v1
kind: RoleBinding
metadata:
  name: {{ include "conquest.fullname" . }}
  labels:
    {{- include "conquest.labels" . | nindent 4 }}
roleRef:
  apiGroup: rbac.authorization.k8s.io
  kind: Role
  name: {{ include "conquest.fullname" . }}
subjects:
  - kind: ServiceAccount
    name: {{ include "conquest.serviceAccountName" . }}
    namespace: {{ .Release.Namespace }}
{{- if .Values.objectfs.enabled }}
---
# ObjectFS requires cluster-scoped PV management for static provisioning.
apiVersion: rbac.authorization.k8s.io/v1
kind: ClusterRole
metadata:
  name: {{ include "conquest.fullname" . }}-objectfs
  labels:
    {{- include "conquest.labels" . | nindent 4 }}
rules:
  - apiGroups: [""]
    resources: ["persistentvolumes"]
    verbs: ["create", "get", "list", "watch", "delete"]
---
apiVersion: rbac.authorization.k8s.io/v1
kind: ClusterRoleBinding
metadata:
  name: {{ include "conquest.fullname" . }}-objectfs
  labels:
    {{- include "conquest.labels" . | nindent 4 }}
roleRef:
  apiGroup: rbac.authorization.k8s.io
  kind: ClusterRole
  name: {{ include "conquest.fullname" . }}-objectfs
subjects:
  - kind: ServiceAccount
    name: {{ include "conquest.serviceAccountName" . }}
    namespace: {{ .Release.Namespace }}
{{- end }}
