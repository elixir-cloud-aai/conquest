apiVersion: apps/v1
kind: Deployment
metadata:
  name: {{ include "conquest.fullname" . }}
  labels:
    {{- include "conquest.labels" . | nindent 4 }}
spec:
  replicas: {{ .Values.conquest.replicaCount }}
  {{- with .Values.conquest.strategy }}
  strategy:
    {{- toYaml . | nindent 4 }}
  {{- end }}
  selector:
    matchLabels:
      {{- include "conquest.selectorLabels" . | nindent 6 }}
  template:
    metadata:
      labels:
        {{- include "conquest.selectorLabels" . | nindent 8 }}
      {{- if or .Values.federation.enabled .Values.auth.enabled }}
      annotations:
        {{- if .Values.federation.enabled }}
        # restart the server when routing changes; it reads the file at start
        checksum/federation: {{ include (print $.Template.BasePath "/federation-secret.yaml") . | sha256sum }}
        {{- end }}
        {{- if .Values.auth.enabled }}
        # restart the server when the auth config changes; it reads the file at start
        checksum/auth: {{ include (print $.Template.BasePath "/auth-configmap.yaml") . | sha256sum }}
        {{- end }}
      {{- end }}
    spec:
      {{- if .Values.global.imagePullSecrets }}
      imagePullSecrets:
        {{- range .Values.global.imagePullSecrets }}
        - name: {{ . }}
        {{- end }}
      {{- end }}
      serviceAccountName: {{ include "conquest.serviceAccountName" . }}
      securityContext:
        {{- toYaml .Values.conquest.podSecurityContext | nindent 8 }}

      initContainers:
        # Database migration — uses the conquest image which has both
        # /migrations and /usr/local/bin/migrate baked in.
        - name: migrate
          image: "{{ .Values.conquest.image.repository }}:{{ .Values.conquest.image.tag }}"
          imagePullPolicy: {{ .Values.conquest.image.pullPolicy }}
          command: ["/usr/local/bin/migrate"]
          args:
            - "-path"
            - "/migrations"
            - "-database"
            - "$(DATABASE_URL)"
            - "up"
          env:
            - name: DATABASE_HOST
              valueFrom:
                secretKeyRef:
                  name: {{ .Values.secrets.postgres.name }}
                  key: host
            - name: DATABASE_PORT
              valueFrom:
                secretKeyRef:
                  name: {{ .Values.secrets.postgres.name }}
                  key: port
            - name: DATABASE_USERNAME
              valueFrom:
                secretKeyRef:
                  name: {{ .Values.secrets.postgres.name }}
                  key: username
            - name: DATABASE_PASSWORD
              valueFrom:
                secretKeyRef:
                  name: {{ .Values.secrets.postgres.name }}
                  key: password
            - name: DATABASE_NAME
              valueFrom:
                secretKeyRef:
                  name: {{ .Values.secrets.postgres.name }}
                  key: dbname
            - name: DATABASE_URL
              value: "postgres://$(DATABASE_USERNAME):$(DATABASE_PASSWORD)@$(DATABASE_HOST):$(DATABASE_PORT)/$(DATABASE_NAME)?sslmode=disable"
          securityContext:
            {{- toYaml .Values.conquest.containerSecurityContext | nindent 12 }}
          {{- with .Values.conquest.migration.resources }}
          resources:
            {{- toYaml . | nindent 12 }}
          {{- end }}

      containers:
        - name: {{ include "conquest.fullname" . }}
          image: "{{ .Values.conquest.image.repository }}:{{ .Values.conquest.image.tag }}"
          imagePullPolicy: {{ .Values.conquest.image.pullPolicy }}
          ports:
            - name: http
              containerPort: {{ .Values.conquest.service.targetPort }}
              protocol: TCP
          securityContext:
            {{- toYaml .Values.conquest.containerSecurityContext | nindent 12 }}
          resources:
            {{- toYaml .Values.conquest.resources | nindent 12 }}
          startupProbe:
            httpGet:
              path: /startupz
              port: http
            failureThreshold: 60
            periodSeconds: 5
          readinessProbe:
            httpGet:
              path: /readyz
              port: http
            timeoutSeconds: 2
            periodSeconds: 5
            failureThreshold: 2
          livenessProbe:
            httpGet:
              path: /healthz
              port: http
            timeoutSeconds: 5
            periodSeconds: 10
            failureThreshold: 6
          env:
            {{- range $key, $value := .Values.conquest.env }}
            - name: {{ $key }}
              value: {{ $value | quote }}
            {{- end }}
            {{- if not .Values.conquest.env.CONQUEST_K8S_NAMESPACE }}
            # Jobs go where the chart's Role grants access.
            - name: CONQUEST_K8S_NAMESPACE
              value: {{ .Release.Namespace | quote }}
            {{- end }}
            {{- if not .Values.conquest.env.CONQUEST_SERVICE_ACCOUNT }}
            {{- if eq (include "conquest.podServiceAccountName" .) (include "conquest.serviceAccountName" .) }}
            {{- fail "conquest.podServiceAccount: runner and task pods need a ServiceAccount other than the server's (conquest.serviceAccount)" }}
            {{- end }}
            # Runner and task pods run as their own ServiceAccount, never the
            # server's.
            - name: CONQUEST_SERVICE_ACCOUNT
              value: {{ include "conquest.podServiceAccountName" . | quote }}
            {{- end }}
            - name: CONQUEST_INTERNAL_BASE_URL
              value: {{ include "conquest.internalBaseURL" . | quote }}
            - name: DATABASE_HOST
              valueFrom:
                secretKeyRef:
                  name: {{ .Values.secrets.postgres.name }}
                  key: host
            - name: DATABASE_PORT
              valueFrom:
                secretKeyRef:
                  name: {{ .Values.secrets.postgres.name }}
                  key: port
            - name: DATABASE_USERNAME
              valueFrom:
                secretKeyRef:
                  name: {{ .Values.secrets.postgres.name }}
                  key: username
            - name: DATABASE_PASSWORD
              valueFrom:
                secretKeyRef:
                  name: {{ .Values.secrets.postgres.name }}
                  key: password
            - name: DATABASE_NAME
              valueFrom:
                secretKeyRef:
                  name: {{ .Values.secrets.postgres.name }}
                  key: dbname
            - name: CONQUEST_POSTGRES_DSN
              value: "postgres://$(DATABASE_USERNAME):$(DATABASE_PASSWORD)@$(DATABASE_HOST):$(DATABASE_PORT)/$(DATABASE_NAME)?sslmode=disable"
            - name: AWS_ACCESS_KEY_ID
              valueFrom:
                secretKeyRef:
                  name: {{ .Values.secrets.storage.name }}
                  key: AWS_ACCESS_KEY_ID
            - name: AWS_SECRET_ACCESS_KEY
              valueFrom:
                secretKeyRef:
                  name: {{ .Values.secrets.storage.name }}
                  key: AWS_SECRET_ACCESS_KEY
            # Used by the K8s backend for init container image in task Jobs.
            - name: CONQUEST_IMAGE
              value: "{{ .Values.conquest.image.repository }}:{{ .Values.conquest.image.tag }}"
            # Used by the run backend for Nextflow runner Jobs.
            - name: CONQUEST_RUNNER_IMAGE
              value: "{{ .Values.conquest.runnerImage.repository }}:{{ .Values.conquest.runnerImage.tag }}"
            - name: CONQUEST_WDL_RUNNER_IMAGE
              value: "{{ .Values.conquest.wdlRunnerImage.repository }}:{{ .Values.conquest.wdlRunnerImage.tag }}"
            {{- if .Values.conquest.snakemakeRunnerImage.repository }}
            - name: CONQUEST_SNAKEMAKE_RUNNER_IMAGE
              value: "{{ .Values.conquest.snakemakeRunnerImage.repository }}:{{ .Values.conquest.snakemakeRunnerImage.tag }}"
            {{- end }}
            {{- if .Values.conquest.snakemakeTaskImage.repository }}
            - name: CONQUEST_SNAKEMAKE_TASK_IMAGE
              value: "{{ .Values.conquest.snakemakeTaskImage.repository }}:{{ .Values.conquest.snakemakeTaskImage.tag }}"
            {{- end }}
            - name: CONQUEST_SNAKEMAKE_DEFAULT_JOBS
              value: {{ .Values.conquest.snakemakeDefaultJobs | quote }}
            - name: CONQUEST_SNAKEMAKE_DEFAULT_DISK_MB
              value: {{ .Values.conquest.snakemakeDefaultDiskMB | quote }}
            - name: CONQUEST_RUNNER_EPHEMERAL_STORAGE_REQUEST
              value: {{ .Values.conquest.runnerEphemeralStorageRequest | quote }}
            - name: CONQUEST_RUNNER_EPHEMERAL_STORAGE_LIMIT
              value: {{ .Values.conquest.runnerEphemeralStorageLimit | quote }}
            - name: CONQUEST_STORAGE_SECRET_NAME
              value: {{ .Values.secrets.storage.name | quote }}
            {{- if .Values.global.imagePullSecrets }}
            - name: CONQUEST_IMAGE_PULL_SECRETS
              value: {{ join "," .Values.global.imagePullSecrets | quote }}
            {{- end }}
            {{- if .Values.conquest.nextflowRunnerImages }}
            - name: CONQUEST_NEXTFLOW_RUNNER_IMAGES
              value: {{ toJson .Values.conquest.nextflowRunnerImages | quote }}
            {{- end }}
            {{- if .Values.conquest.wdlRunnerImages }}
            - name: CONQUEST_WDL_RUNNER_IMAGES
              value: {{ toJson .Values.conquest.wdlRunnerImages | quote }}
            {{- end }}
            {{- if .Values.conquest.snakemakeRunnerImages }}
            - name: CONQUEST_SNAKEMAKE_RUNNER_IMAGES
              value: {{ toJson .Values.conquest.snakemakeRunnerImages | quote }}
            {{- end }}
            {{- if .Values.conquest.snakemakeTaskImages }}
            - name: CONQUEST_SNAKEMAKE_TASK_IMAGES
              value: {{ toJson .Values.conquest.snakemakeTaskImages | quote }}
            {{- end }}
            - name: CONQUEST_WDL_ALLOW_EXTERNAL_IMPORTS
              value: {{ .Values.conquest.wdlAllowExternalImports | quote }}
            - name: CONQUEST_WORKSPACE_MODE
              value: {{ .Values.conquest.workspace.mode | quote }}
            - name: CONQUEST_WORKSPACE_ACCESS_MODE
              value: {{ .Values.conquest.workspace.accessMode | quote }}
            {{- if .Values.conquest.workspace.storageClass }}
            - name: CONQUEST_WORKSPACE_STORAGE_CLASS
              value: {{ .Values.conquest.workspace.storageClass | quote }}
            {{- end }}
            - name: CONQUEST_WORKSPACE_SIZE
              value: {{ .Values.conquest.workspace.size | quote }}
            {{- if .Values.objectfs.enabled }}
            - name: CONQUEST_OBJECTFS_CSI_SECRET_NAME
              value: "csi-s3-secret"
            - name: CONQUEST_OBJECTFS_CSI_SECRET_NAMESPACE
              value: {{ .Release.Namespace | quote }}
            {{- end }}
            - name: CONQUEST_POD_SECURITY
              value: {{ .Values.conquest.podSecurity.profile | quote }}
            - name: CONQUEST_POD_RUN_AS_USER
              value: {{ .Values.conquest.podSecurity.runAsUser | quote }}
            - name: CONQUEST_POD_RUN_AS_GROUP
              value: {{ .Values.conquest.podSecurity.runAsGroup | quote }}
            {{- with .Values.conquest.taskHelperResources }}
            - name: CONQUEST_TASK_HELPER_RESOURCES
              value: {{ toJson . | quote }}
            {{- end }}
            {{- if .Values.storageGateway.enabled }}
            - name: CONQUEST_STORAGE_GATEWAY_URL
              value: {{ required "storageGateway.publicURL is required" .Values.storageGateway.publicURL | quote }}
            {{- end }}
            {{- if .Values.storageIsolation.enabled }}
            - name: CONQUEST_STORAGE_ISOLATION
              value: "true"
            {{- end }}
            {{- $runBuckets := .Values.storageIsolation.runBuckets | default "shared" }}
            - name: CONQUEST_RUN_BUCKETS
              value: {{ $runBuckets | quote }}
            {{- if eq $runBuckets "obc" }}
            {{- /* the server refuses these too; fail at render time already */}}
            {{- if not .Values.storageIsolation.enabled }}
            {{- fail "storageIsolation.runBuckets obc needs storageIsolation.enabled: without it, task pods get the bucket-wide S3 credentials" }}
            {{- end }}
            {{- if eq .Values.conquest.workspace.mode "objectfs" }}
            {{- fail "storageIsolation.runBuckets obc doesn't work with conquest.workspace.mode objectfs: it mounts the configured bucket" }}
            {{- end }}
            {{- $obc := .Values.storageIsolation.obc | default dict }}
            - name: CONQUEST_RUN_BUCKETS_OBC_STORAGE_CLASS
              value: {{ required "storageIsolation.obc.storageClassName is required with runBuckets obc" $obc.storageClassName | quote }}
            {{- with $obc.maxSize }}
            - name: CONQUEST_RUN_BUCKETS_OBC_MAX_SIZE
              value: {{ . | quote }}
            {{- end }}
            {{- with $obc.maxObjects }}
            - name: CONQUEST_RUN_BUCKETS_OBC_MAX_OBJECTS
              value: {{ . | int64 | quote }}
            {{- end }}
            {{- with $obc.bindTimeout }}
            - name: CONQUEST_RUN_BUCKETS_OBC_BIND_TIMEOUT
              value: {{ . | quote }}
            {{- end }}
            {{- end }}
            - name: CONQUEST_RUNNER_SECRET
              valueFrom:
                secretKeyRef:
                  name: {{ .Values.runner.existingSecret | default (printf "%s-runner" (include "conquest.fullname" . | trunc 56 | trimSuffix "-")) }}
                  key: runner-secret
            {{- with .Values.cors.allowedOrigins }}
            - name: CONQUEST_CORS_ALLOWED_ORIGINS
              value: {{ join "," . | quote }}
            {{- end }}
            {{- $si := .Values.serviceInfo | default dict }}
            {{- $org := $si.organization | default dict }}
            {{- /* values trimmed, as the server trims them */}}
            {{- $t := dict
                  "ID" ($si.id | default "" | toString | trim) "NAME" ($si.name | default "" | toString | trim)
                  "DESCRIPTION" ($si.description | default "" | toString | trim)
                  "ORGANIZATION_NAME" ($org.name | default "" | toString | trim) "ORGANIZATION_URL" ($org.url | default "" | toString | trim)
                  "CONTACT_URL" ($si.contactUrl | default "" | toString | trim) "DOCUMENTATION_URL" ($si.documentationUrl | default "" | toString | trim)
                  "ENVIRONMENT" ($si.environment | default "" | toString | trim) "VERSION" ($si.version | default "" | toString | trim) }}
            {{- $siEnv := list
                  (list "ID" $t.ID) (list "NAME" $t.NAME) (list "DESCRIPTION" $t.DESCRIPTION)
                  (list "ORGANIZATION_NAME" $t.ORGANIZATION_NAME) (list "ORGANIZATION_URL" $t.ORGANIZATION_URL)
                  (list "CONTACT_URL" $t.CONTACT_URL) (list "DOCUMENTATION_URL" $t.DOCUMENTATION_URL)
                  (list "ENVIRONMENT" $t.ENVIRONMENT) (list "VERSION" $t.VERSION) }}
            {{- $siSet := false }}
            {{- range $siEnv }}{{ if index . 1 }}{{ $siSet = true }}{{ end }}{{ end }}
            {{- /* same required fields as internal/config */}}
            {{- if and $siSet (not (and $t.ID $t.NAME $t.ORGANIZATION_NAME $t.ORGANIZATION_URL $t.VERSION)) }}
            {{- fail "serviceInfo: id, name, organization.name, organization.url and version are required when any serviceInfo value is set" }}
            {{- end }}
            {{- range $siEnv }}
            {{- if index . 1 }}
            - name: CONQUEST_SERVICE_INFO_{{ index . 0 }}
              value: {{ index . 1 | quote }}
            {{- end }}
            {{- end }}
            {{- if or .Values.storageGateway.enabled .Values.storageIsolation.enabled }}
            - name: CONQUEST_STORAGE_GATEWAY_SECRET
              valueFrom:
                secretKeyRef:
                  name: {{ .Values.storageGateway.existingSecret | default (printf "%s-storage-gateway" (include "conquest.fullname" .)) }}
                  key: secret
            {{- with .Values.storageGateway.s3PublicEndpoint }}
            - name: CONQUEST_S3_PUBLIC_ENDPOINT
              value: {{ . | quote }}
            {{- end }}
            {{- end }}
            {{- if .Values.federation.enabled }}
            - name: CONQUEST_FEDERATION_CONFIG
              value: /etc/conquest/federation/config.yaml
            {{- end }}
            {{- if .Values.auth.enabled }}
            - name: CONQUEST_AUTH_ENABLED
              value: "true"
            - name: CONQUEST_AUTH_SERVICE_INFO_PUBLIC
              value: {{ ne (toString .Values.auth.serviceInfoPublic) "false" | quote }}
            - name: CONQUEST_AUTH_CONFIG
              value: /etc/conquest/auth/config.yaml
            {{- end }}
          {{- if .Values.federation.enabled }}
          {{- with .Values.federation.credentialsSecret }}
          envFrom:
            - secretRef:
                name: {{ . }}
          {{- end }}
          {{- end }}
          {{- if or .Values.federation.enabled .Values.auth.enabled }}
          volumeMounts:
            {{- if .Values.federation.enabled }}
            - name: federation
              mountPath: /etc/conquest/federation
              readOnly: true
            {{- end }}
            {{- if .Values.auth.enabled }}
            - name: auth
              mountPath: /etc/conquest/auth
              readOnly: true
            {{- end }}
      volumes:
        {{- if .Values.federation.enabled }}
        - name: federation
          secret:
            secretName: {{ include "conquest.fullname" . }}-federation
        {{- end }}
        {{- if .Values.auth.enabled }}
        - name: auth
          configMap:
            name: {{ include "conquest.fullname" . }}-auth
        {{- end }}
          {{- end }}
