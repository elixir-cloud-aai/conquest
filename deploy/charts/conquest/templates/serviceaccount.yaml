{{- if .Values.conquest.serviceAccount.create }}
apiVersion: v1
kind: ServiceAccount
metadata:
  name: {{ include "conquest.serviceAccountName" . }}
  labels:
    {{- include "conquest.labels" . | nindent 4 }}
{{- end }}
{{- if .Values.conquest.podServiceAccount.create }}
---
# Runner and task pods: no Role is bound to this account, and it mounts no
# token, so workflow code gets no access to the Kubernetes API (the pods
# also set automountServiceAccountToken: false).
apiVersion: v1
kind: ServiceAccount
metadata:
  name: {{ include "conquest.podServiceAccountName" . }}
  labels:
    {{- include "conquest.labels" . | nindent 4 }}
automountServiceAccountToken: false
{{- end }}
