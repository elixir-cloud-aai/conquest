{{- if not .Values.runner.existingSecret }}
{{- $name := printf "%s-runner" (include "conquest.fullname" . | trunc 56 | trimSuffix "-") }}
{{- $existing := lookup "v1" "Secret" .Release.Namespace $name }}
# Derives the runners' per-run tokens for the runner callback API. Generated
# once and kept across upgrades; rotating it fails the runs in flight.
apiVersion: v1
kind: Secret
metadata:
  name: {{ $name }}
  labels:
    app: {{ .Values.conquest.appname }}
type: Opaque
data:
  {{- if and $existing (index $existing.data "runner-secret") }}
  runner-secret: {{ index $existing.data "runner-secret" }}
  {{- else }}
  runner-secret: {{ randAlphaNum 48 | b64enc }}
  {{- end }}
{{- end }}
